<!doctype html><html lang="th"><meta charset="utf-8"><title>Audit save / reload regression</title><link rel="stylesheet" href="../../snippets/audit-deduction-center-v1.css"><body><button id="reset">เริ่มข้อมูลจำลองใหม่</button><main data-sub="audit" class="gsp-active"></main><script>
if(!['localhost','127.0.0.1'].includes(location.hostname))throw Error('Local tests only');
const DBKEY='audit_reload_fixture_db';document.getElementById('reset').onclick=()=>{localStorage.removeItem(DBKEY);['rb_audit_detected_cache_v1','rb_audit_deductions_v1','rb_listfacebook_followups_v1','rb_listfacebook_base_v1','rb_listfacebook_edits_v1','rb_listfacebook_manual_v1'].forEach(k=>localStorage.removeItem(k));location.reload();};
const row={id:'repair-a',name:'บัญชีทดสอบบันทึก',emp:'DOM',st:'บัญชีถูกจำกัด',prod:'ทดสอบ',note:'',updatedAt:1},today=new Date(),old=new Date(today);old.setDate(old.getDate()-2);const date=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
let db=JSON.parse(localStorage.getItem(DBKEY)||'null')||{'/listfacebook_base_snapshot':{items:[],schemaVersion:5},'/listfacebook_manual':{'repair-a':row},'/listfacebook_edits':{},'/listfacebook_followups':{'repair-a':{stage:'working',nextDate:date(old),updatedAt:1}},'/workflow_audit/deductions_v1':{decisions:{},manual:{},sheetImports:{}}};
window._rbUser={name:'Audit',role:'audit'};window.lpORD=()=>[];window.fbRefreshOrders=cb=>setTimeout(()=>cb(null),80);window.fetch=()=>Promise.reject(Error('No external requests in fixture'));window.fbGet=(path,cb)=>setTimeout(()=>cb(null,JSON.parse(JSON.stringify(db[path]||null))),350);window.fbSet=(path,value)=>new Promise(resolve=>setTimeout(()=>{const cut=path.lastIndexOf('/'),parent=path.slice(0,cut),key=path.slice(cut+1);if(db[parent])db[parent][key]=JSON.parse(JSON.stringify(value));else db[path]=value;localStorage.setItem(DBKEY,JSON.stringify(db));resolve(true);},350));
(async()=>{for(const src of ['list-facebook-editor.js','list-facebook-followup.js','audit-deduction-center-v1.js'])await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='../../snippets/'+src;s.onload=resolve;s.onerror=reject;document.body.appendChild(s);});})();
</script></body></html>
