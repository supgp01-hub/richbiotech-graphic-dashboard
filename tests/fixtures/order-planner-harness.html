<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

</head>
<body>
  <div><button id="ord-add-btn" type="button">+ เพิ่มงานใหม่</button></div>
  <script>
    const fixtureParams = new URLSearchParams(location.search);
    const historyMode = fixtureParams.get('history') === '1';
    const preserveMode = fixtureParams.get('preserve') === '1';
    const cloudMode = fixtureParams.get('cloud') === '1';
    window.__fixtureOnline = fixtureParams.get('offline') !== '1';
    window._rbUser = { name: 'ผู้ทดสอบ', role: fixtureParams.get('role') || 'sup' };
    window.MB_GR = ['MOS', 'DOM', 'TER', 'JAM', 'NUNE', 'BALL'];
    window.OT = ['กราฟิก', 'รูปภาพ', 'ยิงแอด', 'เทสส่วนตัว', 'คัดคลิป', 'Reels', 'สร้างเพจ', 'Retarget'];
    function fixtureCloudRead() { try { return JSON.parse(localStorage.getItem('rb_fixture_planner_cloud') || '{}'); } catch (error) { return {}; } }
    function fixtureCloudWrite(value) { localStorage.setItem('rb_fixture_planner_cloud', JSON.stringify(value || {})); }
    function fixtureOrdersRead() { try { return JSON.parse(localStorage.getItem('rb_fixture_planner_orders') || '{}'); } catch (error) { return {}; } }
    function fixtureOrdersWrite(value) { localStorage.setItem('rb_fixture_planner_orders', JSON.stringify(value || {})); }
    window.fbSet = function (path, value) {
      if (!window.__fixtureOnline) return Promise.resolve(false);
      if (cloudMode && path.indexOf('/order_planner/drafts/') === 0) {
        const cloud = fixtureCloudRead(), key = path.split('/').pop();
        if (value === null) delete cloud[key]; else cloud[key] = JSON.parse(JSON.stringify(value));
        fixtureCloudWrite(cloud);
      }
      if (cloudMode && path.indexOf('/orders/') === 0) {
        const orders = fixtureOrdersRead(), key = path.split('/').pop();
        if (value === null) delete orders[key]; else orders[key] = JSON.parse(JSON.stringify(value));
        fixtureOrdersWrite(orders);
      }
      return Promise.resolve(true);
    };
    window.fbGet = function (path, callback) {
      const done = function () {
        if (cloudMode && path === '/order_planner/drafts') callback(null, fixtureCloudRead());
        else if (fixtureParams.get('stale') === '1' && path === '/order_planner/drafts') callback(null, { stale_draft: { id: 'stale_draft', name: 'ข้อมูลเก่าจากออนไลน์', type: 'กราฟิก', deadline: '2026-09-04', scheduledDate: '2026-09-01', updatedAt: 1 } });
        else callback(null, null);
      };
      const delayMs = Number(fixtureParams.get('delay') || 0);
      if (delayMs > 0) setTimeout(done, delayMs); else done();
    };
    window.fetch = function (url) {
      const data = String(url).includes('/order_planner/drafts.json') ? fixtureCloudRead()
        : String(url).includes('/orders.json') ? fixtureOrdersRead() : {};
      return Promise.resolve({ ok: true, json: function () { return Promise.resolve(JSON.parse(JSON.stringify(data))); } });
    };
    let mockOrders = historyMode ? [{
      id: 'GR090',
      _fbKey: 'planner_draft_history_1',
      sourceDraftId: 'draft_history_1',
      name: 'โปรโมชัน Valore Clinic',
      product: 'Liv CARE',
      type: 'ยิงแอด',
      assignee: 'JAM',
      status: 'pending',
      hook: 'สวยครบทุกโปรในที่เดียว',
      hook2: 'โปรแรงเฉพาะเดือนนี้',
      brief: 'ทำภาพโปรโมชัน 2 เวอร์ชัน แยก HOOK ชัดเจน'
    }] : [];
    if (historyMode) {
      localStorage.setItem('rb_order_planner_drafts_v1', JSON.stringify([{
        id: 'draft_history_1',
        orderId: 'GR090',
        name: 'โปรโมชัน Valore Clinic',
        product: 'Liv CARE',
        type: 'ยิงแอด',
        assignee: 'JAM',
        finalAssignee: 'JAM',
        workStatus: 'pending',
        status: 'dispatched',
        hook: 'สวยครบทุกโปรในที่เดียว',
        hook2: 'โปรแรงเฉพาะเดือนนี้',
        brief: 'ทำภาพโปรโมชัน 2 เวอร์ชัน แยก HOOK ชัดเจน',
        deadline: '2026-09-02',
        scheduledDate: '2026-09-01',
        dispatchTime: '08:30',
        dispatchedAt: 1788226200000,
        updatedBy: 'ผู้ทดสอบ'
      }]));
    } else if (!preserveMode) {
      localStorage.removeItem('rb_order_planner_drafts_v1');
    }
    window.lpORD = function () { return mockOrders.slice(); };
    window.spORD = function (rows) { mockOrders = rows.slice(); };
    window.lvGetDay = function () { return []; };
    const contentRows = [{
        name: 'โปรโมชัน Valore Clinic',
        brand: 'Liv CARE',
        hook: 'สวยครบทุกโปรในที่เดียว',
        link: 'https://example.com/raw',
        script: 'https://example.com/script'
      }, {
        name: 'โปรโมชัน Valore Clinic',
        brand: 'Liv CARE',
        hook: 'โปรแรงเฉพาะเดือนนี้',
        link: 'https://example.com/raw-version-2',
        script: 'https://example.com/script-version-2'
      }, {
        name: 'รีวิวคลินิกจากลูกค้าจริง',
        brand: 'Liv CARE',
        hook: 'เสียงจริงจากลูกค้า',
        link: 'https://example.com/review-raw',
        script: 'https://example.com/review-script'
      }, {
        name: 'โปรโมชัน So Pink',
        brand: 'So Pink',
        hook: 'ผิวสวยมั่นใจ',
        link: 'https://example.com/sopink-raw',
        script: 'https://example.com/sopink-script'
      }];
    window.orderContentRows = function () { return contentRows.slice(); };
    window.refreshOrderContentFromCloud = function () { return Promise.resolve(contentRows.slice()); };
    window._rbProductAssetLinks = {
      'Liv CARE': {
        footage: ['https://example.com/liv-footage'],
        review: ['https://example.com/liv-review']
      },
      'So Pink': {
        footage: ['https://example.com/sopink-footage'],
        review: ['https://example.com/sopink-review']
      }
    };
  </script>
  <script src="../../snippets/persistence-reliability-v3.js?v=fix337"></script>
  <script src="../../snippets/order-planner-v1.js?v=fix361"></script>
</body>
</html>
