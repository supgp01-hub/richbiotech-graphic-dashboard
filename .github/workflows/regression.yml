name: Dashboard regression
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false jsdom@30.0.1
      - run: node tests/run-regression.cjs regression-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-results
          path: regression-results.json
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RB_TEST_BROWSER_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node tests/manual/audit-persistence452.e2e.cjs
      - run: node tests/manual/review-rounds453.e2e.cjs
      - run: node tests/manual/cross-device455.e2e.cjs
      - run: node tests/manual/auth-recovery456.e2e.cjs
      - run: node tests/manual/conflict-recovery458.e2e.cjs
      - run: node tests/manual/content-inline460.e2e.cjs
      - run: node tests/manual/release-auto462.e2e.cjs
      - run: node tests/manual/content-append463.e2e.cjs
      - run: node tests/manual/audit-adjustments464.e2e.cjs
      - run: node tests/manual/audit-evidence470.e2e.cjs
      - run: node tests/manual/audit-inline474.e2e.cjs
      - run: node tests/manual/facebook-pages475.e2e.cjs
      - run: node tests/manual/thai-holidays465.e2e.cjs
      - run: node tests/manual/full-functional-smoke.e2e.js
      - run: node tests/manual/list-facebook-dropdown477.e2e.cjs
      - run: node tests/manual/mobile-workspace481.e2e.cjs
      - run: node tests/manual/mobile-navigation482.e2e.cjs
      - run: node tests/manual/personal-tests483.e2e.cjs
      - run: node tests/manual/cross-device455.e2e.cjs
        env:
          RB_TEST_MOBILE: '1'
