name: Dashboard regression
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false jsdom@30.0.1
      - run: node tests/run-regression.cjs regression-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-results
          path: regression-results.json
